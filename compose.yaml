name: almanac-local

services:
  init:
    image: ${COMPOSE_PROJECT_NAME:-almanac-local}:dev
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    user: "0:0"
    network_mode: none
    command: ["/bin/sh", "/usr/local/lib/almanac/init.sh"]
    restart: "no"
    volumes:
      - app-secrets:/run/almanac-secrets
      - postgres-secret:/run/postgres-secret

  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: almanac
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD_FILE: /run/postgres-secret/password
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-secret:/run/postgres-secret:ro
      - local-agent:/run/almanac-agent
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U almanac -d almanac"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-almanac-local}:dev
    user: "10001:10001"
    command: ["/usr/local/bin/almanac", "db", "upgrade"]
    environment:
      ALMANAC_DATABASE_URL_FILE: /run/almanac-secrets/database-url
    volumes:
      - app-secrets:/run/almanac-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ${COMPOSE_PROJECT_NAME:-almanac-local}:dev
    user: "10001:10001"
    command: ["/usr/local/bin/almanac", "serve", "--components=backend,ui"]
    environment:
      ALMANAC_LISTEN: 0.0.0.0:8080
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoriatraces:10428/insert/opentelemetry/v1/traces
      OTEL_SDK_DISABLED: ${ALMANAC_TELEMETRY_DISABLED:-false}
      ALMANAC_ENVIRONMENT: local
      ALMANAC_COMPONENTS: backend,ui
      ALMANAC_DATABASE_URL_FILE: /run/almanac-secrets/database-url
      ALMANAC_INITIAL_ADMIN_LOGIN: admin
      ALMANAC_INITIAL_ADMIN_PASSWORD_FILE: /run/almanac-secrets/initial-admin-password
      ALMANAC_PUBLIC_ORIGIN: https://localhost:${ALMANAC_PORT:-18088}
      ALMANAC_TLS_CERT_FILE: /run/almanac-secrets/tls.crt
      ALMANAC_TLS_KEY_FILE: /run/almanac-secrets/tls.key
      ALMANAC_SOURCE_SECRET_KEYSET_FILE: /run/almanac-secrets/source-secret-keyset.json
      ALMANAC_SOURCE_SECRET_KEYSET_ID: 00000000-0000-4000-8000-000000000019
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - app-secrets:/run/almanac-secrets:ro
    ports:
      - "127.0.0.1:${ALMANAC_PORT:-18088}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
      provider-ready:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/almanac-secrets/tls.crt", "https://localhost:8080/readyz"]
      interval: 3s
      timeout: 4s
      retries: 30
      start_period: 5s
    stop_grace_period: 35s
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
      - -memory.allowedBytes=256MiB
    volumes:
      - victoriametrics-data:/storage
    ports:
      - "127.0.0.1:${ALMANAC_METRICS_PORT:-18428}:8428"
    healthcheck:
      test: ["CMD", "/victoria-metrics-prod", "-healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.12.1@sha256:609abddf298c9642496045296f30a3968b5a4b79b678373e2e7ef29c844f5578
    command:
      - -httpListenAddr=:10428
      - -storageDataPath=/victoria-traces-data
      - -retentionPeriod=7d
      - -retention.maxDiskSpaceUsageBytes=2GiB
      - -memory.allowedBytes=256MiB
    volumes:
      - victoriatraces-data:/victoria-traces-data
    ports:
      - "127.0.0.1:${ALMANAC_TRACES_PORT:-19428}:10428"
    restart: unless-stopped

  sources-init:
    image: curlimages/curl:8.19.0@sha256:c03110c736db81bbe1be0296f1f1608c81b954b01626bdfb0a8f84e5bd00ff3c
    profiles: ["sources"]
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 10001:10001 /tempo /loki && chmod 0700 /tempo /loki"]
    volumes:
      - tempo-data:/tempo
      - loki-data:/loki
    restart: "no"

  sources-ready:
    image: curlimages/curl:8.19.0@sha256:c03110c736db81bbe1be0296f1f1608c81b954b01626bdfb0a8f84e5bd00ff3c
    profiles: ["sources"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["while :; do sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 2 --output /dev/null http://loki:3100/ready && curl --fail --silent --max-time 2 --output /dev/null http://tempo:3200/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: "no"

  loki:
    image: grafana/loki:3.6.20@sha256:be040ec94865dabe4821ce1c0f109452bd4b5acb566ae376672696eb43caedb7
    profiles: ["sources"]
    depends_on:
      sources-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/loki/almanac.yaml"]
    volumes:
      - ./deploy/local/loki.yaml:/etc/loki/almanac.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${ALMANAC_LOKI_PORT:-13100}:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    profiles: ["sources"]
    depends_on:
      sources-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/tempo/almanac.yaml"]
    volumes:
      - ./deploy/local/tempo.yaml:/etc/tempo/almanac.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${ALMANAC_TEMPO_PORT:-13200}:3200"
      - "127.0.0.1:${ALMANAC_TEMPO_OTLP_PORT:-14318}:4318"
    restart: unless-stopped

  # Seeded dev agent; the explicit `make agent` launcher also builds this image.
  agent:
    image: ${COMPOSE_PROJECT_NAME:-almanac-local}-agent:dev
    build:
      context: .
      dockerfile: deploy/agent/Dockerfile
    profiles: ["agent"]
    network_mode: service:app
    command: ["run", "--backend-url=https://localhost:8080", "--token-file=/run/almanac-agent/token", "--ca-file=/run/almanac-agent/ca.pem"]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoriatraces:10428/insert/opentelemetry/v1/traces
      OTEL_SDK_DISABLED: ${ALMANAC_TELEMETRY_DISABLED:-false}
      ALMANAC_ENVIRONMENT: local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - local-agent:/run/almanac-agent:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  provider-ready:
    image: curlimages/curl:8.19.0@sha256:c03110c736db81bbe1be0296f1f1608c81b954b01626bdfb0a8f84e5bd00ff3c
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        deadline=$$(($$(date +%s) + 45))
        until curl --fail --silent --show-error --max-time 2 --output /dev/null http://victoriametrics:8428/-/ready \
          && curl --fail --silent --show-error --max-time 2 --output /dev/null http://victoriatraces:10428/select/tempo/api/echo; do
          if [ "$$(date +%s)" -ge "$$deadline" ]; then
            echo 'Provider readiness timed out after 45 seconds' >&2
            exit 1
          fi
          sleep 1
        done
    depends_on:
      victoriametrics:
        condition: service_healthy
      victoriatraces:
        condition: service_started
    restart: "no"

volumes:
  app-secrets:
  postgres-secret:
  postgres-data:
  victoriametrics-data:
  victoriatraces-data:
  local-agent:
  loki-data:
  tempo-data:
