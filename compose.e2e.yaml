# Overlay for the end-to-end and performance stacks (scripts/e2e.sh, ADR-0033): their data lives in
# memory, like the dev fixtures, so a run never grows the Docker disk (on macOS, Colima's disk file
# only shrinks after a trim) and removing the stack frees everything it wrote.
services:
  app:
    # Test-only internal listener; no host port or public API route is exposed.
    environment:
      ALMANAC_METRICS_LISTEN: 127.0.0.1:9092
  postgres:
    volumes: !override
      - postgres-secret:/run/postgres-secret:ro
      - type: tmpfs
        target: /var/lib/postgresql
        tmpfs:
          size: 6442450944
  victoriametrics:
    volumes: !override
      - type: tmpfs
        target: /storage
        tmpfs:
          size: 1073741824
  victoriatraces:
    volumes: !override
      - type: tmpfs
        target: /victoria-traces-data
        tmpfs:
          size: 1073741824
  loki:
    volumes: !override
      - ./deploy/local/loki.yaml:/etc/loki/almanac.yaml:ro
      - type: tmpfs
        target: /loki
        tmpfs:
          mode: 01777
          size: 1073741824
  tempo:
    volumes: !override
      - ./deploy/local/tempo.yaml:/etc/tempo/almanac.yaml:ro
      - type: tmpfs
        target: /var/tempo
        tmpfs:
          mode: 01777
          size: 1073741824
