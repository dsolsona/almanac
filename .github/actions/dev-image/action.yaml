# Builds the dev image for the runner's user from the GitHub Actions cache, then installs the Go
# modules and npm dependencies into the dev container's volumes, as `make setup` does locally.
name: Dev image
description: Build the cached dev image and install dependencies
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - id: user
      shell: bash
      run: echo "uid=$(id -u)" >> "$GITHUB_OUTPUT" && echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: deploy/dev/Dockerfile
        build-args: |
          USER_ID=${{ steps.user.outputs.uid }}
          GROUP_ID=${{ steps.user.outputs.gid }}
        tags: almanac-dev:latest
        load: true
        cache-from: type=gha,scope=dev-image
        cache-to: type=gha,scope=dev-image,mode=max
    - name: Install dependencies
      shell: bash
      run: docker compose -f compose.dev.yaml run --rm dev sh -c 'go mod download && cd web && npm ci && cd ../tools/openapi && npm ci'
