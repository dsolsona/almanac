openapi: 3.0.3
info:
  title: Almanac operational API
  version: 1.0.0
  description: Anonymous operational endpoints for the independently runnable UI.
paths:
  /api/v1/auth/context:
    post:
      operationId: postAuthContext
      summary: Read the current authentication context
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding). Authentication
        cookies are optional on context: without a valid session, context creates
        or reuses the __Host-almanac-preauth cookie and returns a tab-specific CSRF
        token for login; with a valid session, it returns a session-bound CSRF token.
        Both cookies are Secure, HttpOnly, SameSite=Lax, Path=/, and have no Domain.
        Authentication operations intentionally do not support Idempotency-Key; a
        supplied key is rejected with 501 capability_unavailable.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyAuthRequest'}}}}
      responses:
        '200': {description: Authentication context, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {$ref: '#/components/responses/AuthenticationProblem'}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Create a local session
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding), the
        __Host-almanac-preauth cookie established by context, and its X-CSRF-Token.
        On success, the pre-authentication cookie is deleted and a protected
        __Host-almanac-session cookie is issued. Both cookies are Secure, HttpOnly,
        SameSite=Lax, Path=/, and have no Domain. Authentication operations
        intentionally do not support Idempotency-Key; a supplied key is rejected
        with 501 capability_unavailable.
      security:
        - PreAuthenticationCookie: []
          CsrfToken: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: Session created, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '401': {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: Session already present, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/AuthenticationRateLimited'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/auth/password:
    post:
      operationId: postAuthPassword
      summary: Change the current password
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding), the
        __Host-almanac-session cookie, and its session-bound X-CSRF-Token. On
        success, the session cookie is replaced with a newly rotated session.
        The cookie is Secure, HttpOnly, SameSite=Lax, Path=/, and has no Domain.
        Authentication operations intentionally do not support Idempotency-Key; a
        supplied key is rejected with 501 capability_unavailable.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordRequest'}}}}
      responses:
        '200': {description: Password changed, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '422': {description: Password rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/AuthenticationRateLimited'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding). Supply either
        the __Host-almanac-session cookie and its session-bound X-CSRF-Token, or
        the __Host-almanac-preauth cookie and its login X-CSRF-Token. When both
        cookies are present, the session cookie takes precedence. Success deletes
        both cookies. They are Secure, HttpOnly, SameSite=Lax, Path=/, and have no
        Domain. Authentication operations intentionally do not support
        Idempotency-Key; a supplied key is rejected with 501 capability_unavailable.
      security:
        - SessionCookie: []
          CsrfToken: []
        - PreAuthenticationCookie: []
          CsrfToken: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyAuthRequest'}}}}
      responses:
        '204': {description: Session cleared}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /livez:
    get:
      operationId: getLiveness
      summary: Report whether the UI process is alive
      security: []
      responses:
        '200':
          description: UI process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {status: ok, component: ui}
        '405': {description: Method not allowed}
  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the configured backend is ready
      security: []
      responses:
        '200':
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {status: ok, component: ui}
        '503':
          description: Backend is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {status: unavailable, component: ui}
        '405': {description: Method not allowed}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-almanac-session
      description: Secure HttpOnly session cookie; required with X-CSRF-Token for password and session logout.
    PreAuthenticationCookie:
      type: apiKey
      in: cookie
      name: __Host-almanac-preauth
      description: Secure HttpOnly cookie established by context; required with X-CSRF-Token for login and anonymous logout.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Tab-specific, cookie-bound token returned by context; purpose depends on the operation.
  schemas:
    EmptyAuthRequest:
      type: object
      additionalProperties: false
    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login: {type: string}
        password: {type: string, format: password}
    PasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, format: password}
    SafeIdentity:
      type: object
      required: [user_id, login, role, restricted]
      properties:
        user_id: {type: string}
        login: {type: string}
        role: {type: string}
        restricted: {type: boolean}
    AuthResponse:
      type: object
      required: [csrf_token, session]
      properties:
        csrf_token: {type: string}
        session:
          allOf: [{$ref: '#/components/schemas/SafeIdentity'}]
          nullable: true
    Problem:
      type: object
      required: [code, message, request_id, field_errors]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        field_errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
    HealthResponse:
      type: object
      required: [status, component]
      properties:
        status: {type: string, enum: [ok, unavailable]}
        component: {type: string, enum: [ui]}
    ProxyProblem:
      type: object
      example:
        code: backend_unavailable
        request_id: 0123456789abcdef0123456789abcdef
        field_errors: []
        message: Configured backend is unavailable
      required: [code, request_id, field_errors, message]
      properties:
        code: {type: string, enum: [backend_unavailable]}
        request_id: {type: string, minLength: 1}
        field_errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
        message: {type: string, example: Configured backend is unavailable}
  responses:
    AuthenticationRateLimited:
      description: Authentication proof throttled
      headers:
        Retry-After:
          required: true
          description: Positive wait time in seconds, rounded up to the next whole second.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    AuthenticationProblem:
      description: Authentication request rejected or unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    AuthenticationMethodNotAllowed:
      description: Only POST is supported
      headers:
        Allow:
          schema: {type: string, enum: [POST]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
