openapi: 3.0.3
info:
  title: Almanac operational API
  version: 1.0.0
  description: Anonymous operational endpoints for the independently runnable UI.
paths:
  /api/agent/v1/configuration:
    get:
      operationId: getAgentConfiguration
      summary: Read the authenticated agent's current configuration snapshot
      description: Requires a verified TLS request and one current agent bearer credential. The identity is derived from the credential; a client-supplied agent ID is never accepted. Matching If-None-Match returns 304 without a body.
      security: [{AgentBearer: []}]
      parameters:
        - {name: If-None-Match, in: header, required: false, schema: {type: string}}
      responses:
        '200':
          description: Full revisioned configuration snapshot
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentConfigurationSnapshot'}
        '304': {description: Snapshot unchanged}
        '401': {description: Agent credential invalid}
        '400': {description: Request rejected, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Configuration unavailable, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/auth/context:
    post:
      operationId: postAuthContext
      summary: Read the current authentication context
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding). Authentication
        cookies are optional on context: without a valid session, context creates
        or reuses the __Host-almanac-preauth cookie and returns a tab-specific CSRF
        token for login; with a valid session, it returns a session-bound CSRF token.
        Both cookies are Secure, HttpOnly, SameSite=Lax, Path=/, and have no Domain.
        Authentication operations intentionally do not support Idempotency-Key; a
        supplied key is rejected with 501 capability_unavailable.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyAuthRequest'}}}}
      responses:
        '200': {description: Authentication context, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {$ref: '#/components/responses/AuthenticationProblem'}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Create a local session
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding), the
        __Host-almanac-preauth cookie established by context, and its X-CSRF-Token.
        On success, the pre-authentication cookie is deleted and a protected
        __Host-almanac-session cookie is issued. Both cookies are Secure, HttpOnly,
        SameSite=Lax, Path=/, and have no Domain. Authentication operations
        intentionally do not support Idempotency-Key; a supplied key is rejected
        with 501 capability_unavailable.
      security:
        - PreAuthenticationCookie: []
          CsrfToken: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: Session created, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '401': {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: Session already present, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/AuthenticationRateLimited'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/auth/password:
    post:
      operationId: postAuthPassword
      summary: Change the current password
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding), the
        __Host-almanac-session cookie, and its session-bound X-CSRF-Token. On
        success, the session cookie is replaced with a newly rotated session.
        The cookie is Secure, HttpOnly, SameSite=Lax, Path=/, and has no Domain.
        Authentication operations intentionally do not support Idempotency-Key; a
        supplied key is rejected with 501 capability_unavailable.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordRequest'}}}}
      responses:
        '200': {description: Password changed, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '401': {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '422': {description: Password rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/AuthenticationRateLimited'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      description: >-
        Requires one Origin header equal to the configured public HTTPS origin and a
        secure TLS request (or correctly trusted proxy forwarding). Supply either
        the __Host-almanac-session cookie and its session-bound X-CSRF-Token, or
        the __Host-almanac-preauth cookie and its login X-CSRF-Token. When both
        cookies are present, the session cookie takes precedence. Success deletes
        both cookies. They are Secure, HttpOnly, SameSite=Lax, Path=/, and have no
        Domain. Authentication operations intentionally do not support
        Idempotency-Key; a supplied key is rejected with 501 capability_unavailable.
      security:
        - SessionCookie: []
          CsrfToken: []
        - PreAuthenticationCookie: []
          CsrfToken: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmptyAuthRequest'}}}}
      responses:
        '204': {description: Session cleared}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '405': {$ref: '#/components/responses/AuthenticationMethodNotAllowed'}
        '403': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '408': {$ref: '#/components/responses/AuthenticationProblem'}
        '413': {$ref: '#/components/responses/AuthenticationProblem'}
        '415': {$ref: '#/components/responses/AuthenticationProblem'}
        '501': {description: Authentication idempotency is unsupported, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: Authentication unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/agents:
    get:
      operationId: getAgents
      summary: List agents
      description: Requires the local session cookie. GET permits an absent Origin and does not require CSRF.
      security: [{SessionCookie: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Agent page, content: {application/json: {schema: {$ref: '#/components/schemas/AgentPage'}}}}
        'default': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    post:
      operationId: postAgents
      summary: Create an agent
      description: Requires one matching Origin and a session-purpose X-CSRF-Token. Fresh creation returns the one-time token; an idempotent replay returns metadata without the token.
      security: [{SessionCookie: [], CsrfToken: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAgentRequest'}}}}
      responses:
        '201': {description: Agent and one-time credential, content: {application/json: {schema: {$ref: '#/components/schemas/AgentIssuanceFresh'}}}}
        '200': {description: Creation receipt replay, content: {application/json: {schema: {$ref: '#/components/schemas/AgentIssuanceReplay'}}}}
        'default': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/agents/{agent_id}:
    get:
      operationId: getAgent
      summary: Read an agent
      description: Requires the local session cookie. GET permits an absent Origin and does not require CSRF. The strong ETag contains the canonical agent UUID and positive decimal version.
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200': {description: Agent, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        'default': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/agents/{agent_id}/credentials:
    get:
      operationId: getAgentCredentials
      summary: Read credential history
      description: Requires the local session cookie. GET permits an absent Origin and does not require CSRF.
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {description: Credential page, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialPage'}}}}
        'default': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/agents/{agent_id}/disable:
    post:
      operationId: postAgentDisable
      summary: Disable an agent
      description: Requires one matching Origin, a session-purpose X-CSRF-Token, strong agent-specific If-Match, and one Idempotency-Key.
      security: [{SessionCookie: [], CsrfToken: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordProofRequest'}}}}
      responses:
        '200': {description: Disable result, content: {application/json: {schema: {$ref: '#/components/schemas/LifecycleResult'}}}}
        'default': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/agents/{agent_id}/credentials/rotate:
    post:
      operationId: postAgentCredentialRotate
      summary: Rotate an agent credential
      description: Requires one matching Origin, a session-purpose X-CSRF-Token, strong agent-specific If-Match, and one Idempotency-Key. Fresh rotation returns a one-time token; receipt replay returns historical metadata without the token.
      security: [{SessionCookie: [], CsrfToken: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RotateAgentRequest'}}}}
      responses:
        '200': {description: Rotation issuance, content: {application/json: {schema: {$ref: '#/components/schemas/RotationIssuanceResponse'}}}}
        'default': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/agents/{agent_id}/credentials/{credential_id}/revoke:
    post:
      operationId: postAgentCredentialRevoke
      summary: Revoke an agent credential
      description: Requires one matching Origin, a session-purpose X-CSRF-Token, strong agent-specific If-Match, and one Idempotency-Key.
      security: [{SessionCookie: [], CsrfToken: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {name: credential_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordProofRequest'}}}}
      responses:
        '200': {description: Revoke result, content: {application/json: {schema: {$ref: '#/components/schemas/LifecycleResult'}}}}
        'default': {description: Request rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /livez:
    get:
      operationId: getLiveness
      summary: Report whether the UI process is alive
      security: []
      responses:
        '200':
          description: UI process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {status: ok, component: ui}
        '405': {description: Method not allowed}
  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the configured backend is ready
      security: []
      responses:
        '200':
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {status: ok, component: ui}
        '503':
          description: Backend is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: {status: unavailable, component: ui}
        '405': {description: Method not allowed}
components:
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong tag exactly formatted as "agent:<canonical-agent-uuid>:<positive-decimal-version>". The version is bounded by signed int64 MaxInt64; weak tags, wildcards and lists are rejected.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One ASCII header value of 1 through 128 visible non-space characters. Commas are part of the key and are not split.
      schema: {type: string, minLength: 1, maxLength: 128}
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      description: Registered agent credential; accepted only over verified TLS.
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-almanac-session
      description: Secure HttpOnly session cookie; required with X-CSRF-Token for password and session logout.
    PreAuthenticationCookie:
      type: apiKey
      in: cookie
      name: __Host-almanac-preauth
      description: Secure HttpOnly cookie established by context; required with X-CSRF-Token for login and anonymous logout.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Tab-specific, cookie-bound token returned by context; purpose depends on the operation.
  schemas:
    Agent:
      type: object
      required: [id, name, display_name, enabled, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        display_name: {type: string}
        enabled: {type: boolean}
        version: {type: string, pattern: '^[1-9][0-9]*$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        runtime:
          nullable: true
          allOf: [{$ref: '#/components/schemas/AgentRuntimeStatus'}]
    AgentRuntimeStatus:
      type: object
      required: [reachability, protocol, software_version, capabilities, last_heartbeat_at, desired_configuration_revision, applied_configuration_revision, scheduler_health, collection_progress, last_attempt_at, last_successful_query_at, next_expected_execution_at, collection_explanation]
      properties:
        reachability: {type: string, enum: [connected, unreachable, incompatible]}
        protocol: {type: string}
        software_version: {type: string}
        capabilities: {type: array, items: {$ref: '#/components/schemas/AgentCapability'}}
        last_heartbeat_at: {type: string, format: date-time, nullable: true}
        desired_configuration_revision: {type: string, pattern: '^[1-9][0-9]*$'}
        applied_configuration_revision: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        scheduler_health: {type: string, enum: [starting, ready, degraded, stopped]}
        collection_progress: {type: string, enum: [not_started, idle, running, blocked]}
        last_attempt_at: {type: string, format: date-time, nullable: true}
        last_successful_query_at: {type: string, format: date-time, nullable: true}
        next_expected_execution_at: {type: string, format: date-time, nullable: true}
        collection_explanation: {type: string, enum: [no_assignment]}
    AgentCapability:
      type: object
      required: [provider, configuration_formats, operations]
      properties:
        provider: {type: string}
        configuration_formats: {type: array, items: {type: string}}
        operations: {type: array, items: {type: string}}
    AgentConfigurationSnapshot:
      type: object
      required: [agent_id, configuration_revision, assignments]
      properties:
        agent_id: {type: string, format: uuid}
        configuration_revision: {type: string, pattern: '^[1-9][0-9]*$'}
        assignments: {type: array, maxItems: 0, items: {type: object}}
    AgentCredential:
      type: object
      required: [id, agent_id, issued_at, expires_at, revoked_at, retire_at]
      properties:
        id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
        retire_at: {type: string, format: date-time, nullable: true}
    AgentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Agent'}}
        next_cursor: {type: string}
    CredentialPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentCredential'}}
        next_cursor: {type: string}
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, display_name]
      properties:
        name: {type: string}
        display_name: {type: string}
        lifetime_seconds: {type: integer, minimum: 0, maximum: 31536000, format: int32}
    RotateAgentRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password: {type: string, format: password}
        lifetime_seconds: {type: integer, minimum: 0, maximum: 31536000, format: int32}
        overlap_seconds: {type: integer, minimum: 0, maximum: 600, format: int32}
    PasswordProofRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password: {type: string, format: password}
    LifecycleResult:
      type: object
      required: [agent, credential, changed, revoked_credential_count, replayed]
      properties:
        agent: {$ref: '#/components/schemas/Agent'}
        credential: {allOf: [{$ref: '#/components/schemas/AgentCredential'}], nullable: true}
        changed: {type: boolean}
        revoked_credential_count: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        replayed: {type: boolean}
    AgentIssuance:
      type: object
      required: [agent, credential, replayed, secret_state]
      properties:
        agent: {$ref: '#/components/schemas/Agent'}
        credential: {$ref: '#/components/schemas/AgentCredential'}
        replayed: {type: boolean}
        secret_state: {type: string, enum: [issued, secret_unavailable]}
        token: {type: string}
    AgentIssuanceFresh:
      allOf:
        - {$ref: '#/components/schemas/AgentIssuance'}
        - type: object
          required: [replayed, secret_state, token]
          properties:
            replayed: {type: boolean, enum: [false]}
            secret_state: {type: string, enum: [issued]}
            token: {type: string, minLength: 1}
    AgentIssuanceReplay:
      allOf:
        - {$ref: '#/components/schemas/AgentIssuance'}
        - type: object
          required: [replayed, secret_state]
          properties:
            replayed: {type: boolean, enum: [true]}
            secret_state: {type: string, enum: [secret_unavailable]}
          not: {required: [token]}
    RotationIssuance:
      type: object
      required: [agent, credential, previous_credential, replayed, secret_state]
      properties:
        agent: {$ref: '#/components/schemas/Agent'}
        credential: {$ref: '#/components/schemas/AgentCredential'}
        previous_credential: {allOf: [{$ref: '#/components/schemas/AgentCredential'}], nullable: true}
        replayed: {type: boolean}
        secret_state: {type: string, enum: [issued, secret_unavailable]}
        token: {type: string}
    RotationIssuanceResponse:
      oneOf:
        - {$ref: '#/components/schemas/RotationIssuanceFresh'}
        - {$ref: '#/components/schemas/RotationIssuanceReplay'}
    RotationIssuanceFresh:
      allOf:
        - {$ref: '#/components/schemas/RotationIssuance'}
        - type: object
          required: [replayed, secret_state, token]
          properties:
            replayed: {type: boolean, enum: [false]}
            secret_state: {type: string, enum: [issued]}
            token: {type: string, minLength: 1}
    RotationIssuanceReplay:
      allOf:
        - {$ref: '#/components/schemas/RotationIssuance'}
        - type: object
          required: [replayed, secret_state]
          properties:
            replayed: {type: boolean, enum: [true]}
            secret_state: {type: string, enum: [secret_unavailable]}
          not: {required: [token]}
    EmptyAuthRequest:
      type: object
      additionalProperties: false
    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login: {type: string}
        password: {type: string, format: password}
    PasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, format: password}
    SafeIdentity:
      type: object
      required: [user_id, login, role, restricted]
      properties:
        user_id: {type: string}
        login: {type: string}
        role: {type: string}
        restricted: {type: boolean}
    AuthResponse:
      type: object
      required: [csrf_token, session]
      properties:
        csrf_token: {type: string}
        session:
          allOf: [{$ref: '#/components/schemas/SafeIdentity'}]
          nullable: true
    Problem:
      type: object
      required: [code, message, request_id, field_errors]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        field_errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
    HealthResponse:
      type: object
      required: [status, component]
      properties:
        status: {type: string, enum: [ok, unavailable]}
        component: {type: string, enum: [ui, backend]}
    ProxyProblem:
      type: object
      example:
        code: backend_unavailable
        request_id: 0123456789abcdef0123456789abcdef
        field_errors: []
        message: Configured backend is unavailable
      required: [code, request_id, field_errors, message]
      properties:
        code: {type: string, enum: [backend_unavailable]}
        request_id: {type: string, minLength: 1}
        field_errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
        message: {type: string, example: Configured backend is unavailable}
  responses:
    AuthenticationRateLimited:
      description: Authentication proof throttled
      headers:
        Retry-After:
          required: true
          description: Positive wait time in seconds, rounded up to the next whole second.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    AuthenticationProblem:
      description: Authentication request rejected or unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    AuthenticationMethodNotAllowed:
      description: Only POST is supported
      headers:
        Allow:
          schema: {type: string, enum: [POST]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
