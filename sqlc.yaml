version: "2"
sql:
  - engine: postgresql
    queries: internal/storage/query
    schema:
      - internal/storage/bootstrap.sql
      - internal/storage/migrations/0001_installation.sql
      - internal/storage/migrations/0002_initial_owner.sql
    gen:
      go:
        package: dbgen
        out: internal/storage/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
