version: "2"
sql:
  - engine: postgresql
    queries: internal/storage/query
    schema:
      - internal/storage/bootstrap.sql
      - internal/storage/migrations/0001_installation.sql
      - internal/storage/migrations/0002_initial_owner.sql
      - internal/storage/migrations/0003_local_sessions.sql
      - internal/storage/migrations/0004_login_attempts.sql
      - internal/storage/migrations/0005_agents.sql
      - internal/storage/migrations/0006_agent_pagination_indexes.sql
      - internal/storage/migrations/0007_agent_credential_retirement.sql
      - internal/storage/migrations/0008_agent_rotation_lookup_index.sql
      - internal/storage/migrations/0009_agent_ownership.sql
      - internal/storage/migrations/0010_agent_runtime.sql
      - internal/storage/migrations/0011_datasources.sql
      - internal/storage/migrations/0012_diagnostic_result_digest.sql
      - internal/storage/migrations/0013_sli_observations.sql
      - internal/storage/migrations/0014_agent_archival.sql
      - internal/storage/migrations/0015_datasource_reassignment.sql
      - internal/storage/migrations/0016_sli_attempt_cursor.sql
    gen:
      go:
        package: dbgen
        out: internal/storage/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
